    url: https://www.linkedin.com/feed/update/urn:li:activity:7512938323074682881/
    text: |
      As AI agents become more autonomous, how can we protect them against different types of attacks without limiting their ability to get useful work done?

      We explore this question in our new work, Pincer: a new security layer for autonomous agents.

      Pincer uses a digital twin that learns a user's preferences and makes context-aware authorization decisions on their behalf, enabling dynamic, user-specific least privilege.
